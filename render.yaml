databases:
  - name: skyguard-db
    databaseName: skyguard
    user: skyguard
    plan: free
    postgresMajorVersion: 15

services:
  - type: web
    name: skyguard-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: skyguard-db
          property: connectionString
      - key: FRONTEND_URL
        value: "https://skyguard-frontend.onrender.com" # Replace with actual frontend URL once generated

  - type: web
    name: skyguard-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: skyguard-backend
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
