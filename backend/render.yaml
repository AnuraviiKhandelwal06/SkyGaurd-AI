services:
  - type: web
    name: skyguard-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && pip install -r ../ml-development/requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skyguard-db
          property: connectionURI
      - key: FRONTEND_URL
        value: https://sky-gaurd-ai.vercel.app
      - key: PYTHONPATH
        value: /opt/render/project/src/backend:/opt/render/project/src
      - key: POLL_INTERVAL_MINUTES
        value: "5"

databases:
  - name: skyguard-db
    plan: free
    databaseName: skyguard
